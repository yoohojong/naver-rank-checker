name: shop-count-1123
# 2026-11-23 족저근막염 대안 49개 국내 제품 수 — 공식 쇼핑 검색 API 읽기 전용. feat/ 가지에서만.
on:
  push:
    branches: [feat/shop-count-1123]
    paths:
      - scripts/shop_count_1123.py
      - data/shop_count_1123.json
      - .github/workflows/shop-count-1123.yml
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with: {python-version: '3.13'}
      - env:
          NAVER_OPENAPI_CLIENT_ID: ${{ secrets.NAVER_OPENAPI_CLIENT_ID }}
          NAVER_OPENAPI_CLIENT_SECRET: ${{ secrets.NAVER_OPENAPI_CLIENT_SECRET }}
        run: python -u scripts/shop_count_1123.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'shop-count', path: out/, retention-days: 14}
