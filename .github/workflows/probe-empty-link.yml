name: probe-empty-link
# 10-31 15:00 빈 링크 원인 임시 진단 — 읽기 전용(드라이브 판 기록 · 활동 기록), probe/ 가지에서만 돈다. main 에 합치지 않는다.
on:
  push:
    branches: ['probe/empty-link-1031']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with: {python-version: '3.13'}
      - run: python -m pip install -q google-auth==2.36.0 requests openpyxl
      - run: python -u scripts/probe_empty_link_revisions.py
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          PYTHONIOENCODING: utf-8
