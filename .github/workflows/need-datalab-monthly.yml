name: need-datalab-monthly
# 욕구 검색어의 달마다 검색 흐름 받기 — 네이버 데이터랩 검색어 트렌드(공식 API).
# 2026-10-26 노력 욕구 창 · 사장님 "같은 프로그램인데 … 그 선 연결이 안되어있던걸".
# keyword-surround-api 와 같은 방식: 새 실행 파일만 더하기(기존 코드 안 고침) · 예약(cron) 없음.
# 받는 명령: gh run download <실행번호> -R yoohojong/naver-rank-checker -n need-datalab-monthly
on:
  push:
    branches: [feat/need-datalab-monthly]
    paths:
      - scripts/need_datalab_monthly.py
      - .github/workflows/need-datalab-monthly.yml
  workflow_dispatch:
    inputs:
      keywords:
        description: '쉼표로 가른 검색어(400개 안팎까지)'
        required: false
        default: '지루성두피염,여드름,거북목교정,탈모'
      anchor:
        description: '모든 호출에 넣는 기준 검색어'
        required: false
        default: '다이어트'
      start:
        description: '시작일'
        required: false
        default: '2023-10-01'
      end:
        description: '끝일'
        required: false
        default: '2026-09-30'

concurrency:
  group: need-datalab-monthly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ github.token }}

      - name: Setup Python 3.13
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Fetch
        env:
          NAVER_OPENAPI_CLIENT_ID: ${{ secrets.NAVER_OPENAPI_CLIENT_ID }}
          NAVER_OPENAPI_CLIENT_SECRET: ${{ secrets.NAVER_OPENAPI_CLIENT_SECRET }}
          KEYWORDS: ${{ github.event.inputs.keywords || '지루성두피염,여드름,거북목교정,탈모' }}
          ANCHOR: ${{ github.event.inputs.anchor }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
        run: python scripts/need_datalab_monthly.py --out-dir out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: need-datalab-monthly
          path: out/*.json
          retention-days: 14
          if-no-files-found: error
