name: need-datalab-web
# 욕구 검색어의 달마다 검색 흐름 — 네이버 데이터랩 공개 화면(로그인 없음). 예약 없음 · 손으로 부를 때만.
# 2026-10-26 노력 욕구 창 · 사장님 "깃헙 우회 루트 있다며". 받는 명령: gh run download <번호> -R yoohojong/naver-rank-checker -n need-datalab-web
on:
  push:
    branches: [feat/need-datalab-monthly]
    paths: [scripts/need_datalab_web.py, .github/workflows/need-datalab-web.yml]
  workflow_dispatch:
    inputs:
      keywords: {description: '쉼표로 가른 검색어', required: false, default: '지루성두피염,비염,곱슬머리,한포진'}
      anchor: {description: '기준 검색어', required: false, default: '다이어트'}
      start: {description: '시작일', required: false, default: '2023-10-01'}
      end: {description: '끝일', required: false, default: '2026-09-30'}
concurrency: {group: need-datalab-web, cancel-in-progress: false}
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with: {python-version: '3.13'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - env:
          KEYWORDS: ${{ github.event.inputs.keywords || '지루성두피염,비염,곱슬머리,한포진' }}
          ANCHOR: ${{ github.event.inputs.anchor }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
        run: python scripts/need_datalab_web.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: need-datalab-web, path: out/, retention-days: 14}
