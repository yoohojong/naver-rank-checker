name: keyword-surround-api
# 키워드 주변 정보 받기 — 네이버 공식 검색 API(블로그 · 카페 · 지식인 · 쇼핑 상위 30개).
# 2026-10-25 ⑧ 디테일 코벤 창 부탁 · 사장님 승인 '순위체커 저장소에 새 실행 파일만 더하기(기존 코드 안 고침)'.
# 결과물 이름 gapmap-keyword-surround — 받는 명령: gh run download <실행번호> -R yoohojong/naver-rank-checker -n gapmap-keyword-surround
# 예약(cron) 없음: 이 가지에 올릴 때 · 손으로 부를 때만 돈다.
on:
  push:
    branches: [feat/keyword-surround-api]
    paths:
      - scripts/keyword_surround_api.py
      - .github/workflows/keyword-surround-api.yml
  workflow_dispatch:
    inputs:
      keywords:
        description: '쉼표로 가른 키워드(10개까지)'
        required: false
        default: '딕션관리기,식스칙구균제,메아리셋,열보초크림'

concurrency:
  group: keyword-surround-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ github.token }}

      - name: Setup Python 3.13
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Fetch
        env:
          NAVER_OPENAPI_CLIENT_ID: ${{ secrets.NAVER_OPENAPI_CLIENT_ID }}
          NAVER_OPENAPI_CLIENT_SECRET: ${{ secrets.NAVER_OPENAPI_CLIENT_SECRET }}
          KEYWORDS: ${{ github.event.inputs.keywords }}
        run: python scripts/keyword_surround_api.py --out-dir out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gapmap-keyword-surround
          path: out/*.json
          retention-days: 14
          if-no-files-found: error
