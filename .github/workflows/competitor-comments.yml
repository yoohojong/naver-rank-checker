name: 경쟁사-댓글-제품명

# 키워드 검색 → 상위노출된 남의 글 → 댓글 → 경쟁 제품명·횟수 → 시트 '경쟁사'
#
# 사장님 정의(2026-07-23): 경쟁사 = 남의 글 댓글에서 팔리는 **제품**(카페 이름이 아님).
# 여기(Actions)서 도는 이유: 카페 댓글 접근이 되고(2026-07-23 실증), 제품명 판정용
# Groq 키가 여기 있다. 사장님 PC 에서는 둘 다 안 된다.

on:
  # 매일 1회 (KST 05:00). 순위 검사(KST 00·06·12·18시)와 겹치지 않는 시간대.
  # 댓글은 순위만큼 자주 바뀌지 않아 하루 1번이면 충분하다.
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 제품군마다 볼 키워드 수 (0 = 전체)
        default: '0'
      top_posts:
        description: 키워드마다 볼 남의 글 수
        default: '4'
      write_sheet:
        description: 시트에 쓸지 (false 면 로그로만 확인)
        default: 'true'

concurrency:
  group: competitor-comments
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      # ★job 레벨 permissions 는 top-level 을 '병합' 이 아니라 **대체**한다.
      #   여기 안 적힌 스코프는 none 이 되므로, 위에 적어둔 actions·issues 를
      #   여기에도 다시 써야 자가치유가 로그를 읽고 이슈를 열 수 있다(독립검토 H-2).
      contents: write        # 판정 결과(data/brand_verdicts.json)를 되돌려 저장한다
      actions: read          # 자가치유: 최근 run·실패 로그 조회
      issues: write          # 자가치유: 3회 연속 실패 시 확인용 이슈
    # 키워드가 1,240개(2026-08-12 확장)라 댓글 훑기만 130분 안팎이다. 읽기(AI)는
    # comment_reads 캐시 + 회차 예산(READ_BATCH_BUDGET)으로 묶여 수십 분을 넘지 않는다.
    # 180분이던 시절 7/29~8/16 매일 밤 시간 초과로 취소됐다(공개 repo — 분당 과금 없음).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup venv + install deps
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q --upgrade pip
          ./.venv/bin/pip install -q -r requirements.txt

      - name: Collect competitor products from comments
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          CAFE_WHITELIST_SLUGS: ${{ secrets.CAFE_WHITELIST_SLUGS }}
          # 제품명 읽기·판정. **무료(GROQ) 먼저, 무료가 막힌 몫만 유료(ANTHROPIC) 보험**
          # (2026-07-24 뒤집음 — 순서가 곧 돈이다. 옛 주석이 반대로 남아 있었음).
          # ANTHROPIC_API_KEY 는 아직 미설정(2026-08-20) — 넣는 순간 보험이 켜진다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 모델 이름은 코드에 없다 — 계정에 물어 자동 선택(src/llm_pick).
          # 2026-08-16 llama-3.3 퇴역 404 사흘의 재발 방지. secret 으로 주면 그게 위다.
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # 한 회차가 AI 에 보낼 댓글 묶음 상한 — 밀린 몫은 다음 회차가 이어 읽는다
          # (comment_reads 캐시). 유료 보험이 있어도 한 회차 비용이 이걸 못 넘는다.
          READ_BATCH_BUDGET: '500'
          NAVER_SLOWDOWN_BASE_SEC: '4.0'
          PYTHONIOENCODING: 'utf-8'
        run: |
          # 예약 실행(schedule)은 inputs 가 비어 있다 → 전체 키워드·시트 기록이 기본.
          ./.venv/bin/python -u -m scripts.collect_comment_brands \
            --from-sheet \
            --limit "${{ inputs.limit || '0' }}" \
            --top-posts "${{ inputs.top_posts || '4' }}" \
            --mentions-file mentions.json \
            ${{ (inputs.write_sheet == 'false') && ' ' || '--write-sheet' }}

      # 댓글 훑기가 이 작업의 45분이다. 판정만 실패했을 때 다시 훑지 않도록 남겨둔다.
      - name: 모아둔 댓글 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentions
          path: mentions.json
          retention-days: 3
          if-no-files-found: ignore

      # 한 번 내린 제품 판정 + 한 번 읽은 댓글(comment_reads)은 남긴다 —
      # 다음 run 은 새 것만 물어본다. (Groq 무료 하루치를 아끼는 핵심이자,
      # 키워드 1,240개 시대에 시간 초과를 막는 몸통. 시트를 못 쓴 날(exit 3)에도
      # 여기가 always 로 저장돼 다음 회차가 이어 읽는다.)
      - name: 판정·읽기 기억 저장
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/brand_verdicts.json data/comment_reads.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/brand_verdicts.json data/comment_reads.json
            git commit -m "chore(경쟁사): 판정·읽기 기억 갱신 [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
          fi

      # 조용히 실패하면 사장님은 어제 표를 오늘 것으로 믿게 된다 → 실패는 반드시 알린다.
      # 판정이 많이 비어 시트를 건너뛴 경우(종료코드 3)도 여기로 온다.
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 왜 멈췄는지는 프로그램이 파일로 남겨둔다 — 로그를 되읽지 않는다.
          # (자가치유는 자기 job 이 도는 중이라 GitHub 에서 자기 로그를 못 받아
          #  라이브에서 매번 "원인: 알 수 없음" 이 나갔다 — 2026-07-24)
          MSG="❌ 경쟁사 댓글 수집 실패 — 시트 '경쟁사' 는 어제 값 그대로입니다. 다음 예약(내일 05시)에 다시 시도합니다."
          if [ -s .harness/last_skip_reason.txt ]; then
            REASON="$(head -c 300 .harness/last_skip_reason.txt)"
            MSG="⏸ 경쟁사 표 오늘은 갱신 안 함 — ${REASON}. 수집 자체는 됐고, 판정이 모자라 어제 값을 지켰습니다. 내일 05시에 다시 시도합니다."
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              > /dev/null || true
          fi

      # ── 자가치유 보고 (2026-07-24) ──────────────────────────────────────
      - name: 자가치유 보고
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★2026-09-03: TIMEOUT_MIN: '300' 을 지웠다. 위 timeout-minutes 와 같은 값을
          #   여기 또 적는 구조였고, 발행검수는 그걸 빠뜨려 120분을 다 채우고 잘려도
          #   문자가 0통이었다. 이제 자가치유가 이 파일의 timeout-minutes 를 직접 읽는다
          #   — 적는 자리가 하나뿐이라 다음에 빠뜨릴 자리가 없다.
          #   (WORKFLOW_FILE 이 그 파일을 가리키므로 이 줄은 계속 필요하다.)
          WORKFLOW_FILE: competitor-comments.yml
          PYTHONIOENCODING: utf-8
        run: python scripts/자가치유.py --이름 "댓글 경쟁제품 수집" --결과 ${{ job.status }} --크론 "0 20 * * *"
