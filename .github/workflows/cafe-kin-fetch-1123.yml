name: cafe-kin-fetch-1123
# 2026-11-23 족저근막염 - 지식인 본문(A) · 회원 카페 310편 본문(B) 동시 받기. 읽기 전용. feat/ 가지에서만.
on:
  push:
    branches: [feat/cafe-kin-fetch-1123]
    paths:
      - scripts/cafe_kin_1123.py
      - data/kin_fetch_1123.json
      - data/cafe_member310.json
      - .github/workflows/cafe-kin-fetch-1123.yml
permissions:
  contents: read
jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        part: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with: {python-version: '3.13'}
      - env:
          PART: ${{ matrix.part }}
          NAVER_OPENAPI_CLIENT_ID: ${{ secrets.NAVER_OPENAPI_CLIENT_ID }}
          NAVER_OPENAPI_CLIENT_SECRET: ${{ secrets.NAVER_OPENAPI_CLIENT_SECRET }}
        run: python -u scripts/cafe_kin_1123.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'cafe-kin-fetch-${{ matrix.part }}', path: out/, retention-days: 14}
