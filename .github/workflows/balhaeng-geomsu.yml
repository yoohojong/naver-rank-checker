name: 발행검수
# 발행 검수 — 매일 1회. 시트 링크 → 카페 글 수집 → 채점 → '발행 검수' 탭 기록.
# 사장님 승인(2026-07-23): "전체로 자동으로 시트에 반영까지 해서 ㄱㄱ 매일 1번씩"
#
# 시간: KST 04:00 (= UTC 19:00 전날). 전날 발행분의 댓글이 다 달린 뒤에 재기 위함.
# 쓰기 범위: **'발행 검수' 탭에만** 쓴다. 기존 탭은 건드리지 않는다.
# 차단 회피: 레포 표준(curl_cffi chrome131 + 3.5~5초 간격).

on:
  schedule:
    - cron: '0 19 * * *'      # KST 04:00
  workflow_dispatch:
    inputs:
      limit:
        description: '검수할 글 수'
        required: false
        default: '60'
      write:
        description: "시트에 쓸까요 (1=쓴다 / 0=결과만 보고 안 씀)"
        required: false
        default: '1'
      notify:
        # ★2026-11-01 알림 새 기준(판정표 B13): 검수 보고 · 고장 문자는 이제 안 보낸다. 이 값은 손 시험에서
        #   자가치유 단계(사장님 몫 — 열쇠 · 로그인 · 결제일 때만 문자)를 끌지 정하는 데만 쓴다.
        description: "자가치유 단계를 돌릴까요 (1=돈다 / 0=손 시험이라 안 돎)"
        required: false
        default: '1'

concurrency:
  group: balhaeng-geomsu
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ github.token }}

      - name: Setup Python 3.13
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Setup venv + install deps
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements.txt

      # ★2026-11-01 알림 새 기준(판정표 B13): 검수 결과는 직원 일 결과라 사장님 텔레그램을 보내지 않는다 —
      #   결과는 시트 '발행 검수' 탭과 이 실행 기록에 남고, 진짜 고장은 이 스텝이 실패로 끝나
      #   실패카드 장치(D:/ai-office/설치/실패카드 · 30분마다)가 아래 자가치유 단계가 붙은 이 실행을 읽어 카드를 낸다.
      #   그래서 텔레그램 열쇠를 이 스텝에 넘기지 않는다.
      - name: Run 발행 검수
        id: audit
        shell: bash
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GEOMSU_LIMIT: ${{ github.event.inputs.limit || '150' }}
          GEOMSU_WRITE: ${{ github.event.inputs.write || '1' }}
          GEOMSU_NOTIFY: ${{ github.event.inputs.notify || '1' }}
          # 제한시간(120분)에 걸려 '취소'로 끝나면 알림이 한 통도 안 나간다.
          # 그 전에 스크립트가 스스로 끊고 남은 건수를 보고에 적는다.
          GEOMSU_DEADLINE_MIN: '90'
          PYTHONIOENCODING: 'utf-8'
        run: |
          set -o pipefail
          ./.venv/bin/python -u -m scripts.balhaeng_geomsu 2>&1 | tee geomsu.log

      # ★2026-11-01 알림 새 기준(판정표 B13): 예전 'Notify on failure'(파이썬이 못 뜬 날 사장님께 마지막 기록 8줄을
      #   보내던 그물)를 기록만 남기는 스텝으로 바꿨다. job 은 위 스텝 실패로 이미 실패다 — 실패카드가 받는다.
      #   '취소'(제한시간)도 기록이 남게 always() 로 둔다.
      - name: 실패 기록 남기기 (사장님 문자 대신)
        if: ${{ always() && steps.audit.outcome != 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "::error::발행 검수가 끝까지 돌지 못했습니다(단계 결과=${{ steps.audit.outcome }}) — 마지막 기록:"
          if [ -f geomsu.log ]; then
            grep -v '^[[:space:]]*$' geomsu.log | tail -n 8
          else
            echo "(로그 파일이 남지 않았습니다 — 파이썬이 뜨기 전에 멈춘 것)"
          fi

      # ── 자가치유 보고 (2026-07-24) ──────────────────────────────────────
      # ★손 시험(notify=0)에서는 돌지 않는다 — 2026-10-21 손 시험 때 성공으로 끝나면 '✅ 복구됨' 문자를
      #   보내고 이슈를 닫게 돼 있어(자가치유.py 성공 갈래) 그 전에 취소했다. 정기 실행·notify=1 손 실행은 그대로 always().
      - name: 자가치유 보고
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.notify != '0') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: balhaeng-geomsu.yml
          PYTHONIOENCODING: utf-8
        run: python scripts/자가치유.py --이름 "발행본 검수" --결과 ${{ job.status }} --크론 "0 19 * * *"
